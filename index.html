/* =========================

========================= */

function showScreen(id){

  const screens = [

    "homeScreen",
    "lobbyScreen",
    "answerScreen",
    "revealScreen",
    "voteScreen",
    "resultScreen"

  ];

  screens.forEach(screen => {

/* =========================

========================= */

function showError(message){

  const box =
    document.getElementById("homeError");

  box.innerText = message;
  box.style.display = "block";

  setTimeout(() => {

    box.style.display = "none";

  },5000);

/* =========================
   ROOM CODE
========================= */

function generateRoomCode(){

  return Math.floor(
    100000 +
    Math.random() * 900000
  ).toString();

}


/* =========================
   CREATE ROOM
========================= */

window.createRoom = async function(){

  const name =
    document
      .getElementById("nameInput")
      .value.trim();

  if(!name){

    showError("닉네임을 먼저 입력해주세요.");
    return;

  }

  let code;

  for(let i=0;i<10;i++){

    const candidate =
      generateRoomCode();

    const snapshot =
      await get(
        ref(db,"rooms/"+candidate)
      );

    if(!snapshot.exists()){

      code = candidate;
      break;

    }

  }

  if(!code){

    showError(
      "방을 만들지 못했습니다. 다시 시도해주세요."
    );

    return;
  }


  roomCode = code;

  const player = {

    name:name,
    joinedAt:Date.now()

  };


  await set(

    ref(db,"rooms/"+roomCode),

    {

      hostId:myId,

      phase:"lobby",

      round:0,

      spyId:"",

      question:null,

      players:{
        [myId]:player
      },

      answers:{},

      votes:{},

      usedQuestions:{},

      result:null

    }

  );


  localStorage.setItem(
    "spyCheckRoom",
    roomCode
  );


  setupDisconnect();

  listenRoom();

};


/* =========================
   JOIN ROOM
========================= */

window.joinRoom = async function(){

  const name =
    document
      .getElementById("nameInput")
      .value.trim();

  const code =
    document
      .getElementById("roomInput")
      .value.trim();

  if(!name){

    showError("닉네임을 먼저 입력해주세요.");
    return;

  }

  if(!/^\d{6}$/.test(code)){

    showError("6자리 방 코드를 입력해주세요.");
    return;

  }


  const snapshot =
    await get(
      ref(db,"rooms/"+code)
    );


  if(!snapshot.exists()){

    showError("존재하지 않는 방입니다.");
    return;

  }


  const data = snapshot.val();


  if(data.phase !== "lobby"){

    showError("이미 게임이 시작된 방입니다.");
    return;

  }


  roomCode = code;


  await update(

    ref(
      db,
      "rooms/"+roomCode+"/players/"+myId
    ),

    {

      name:name,
      joinedAt:Date.now()

    }

  );


  localStorage.setItem(
    "spyCheckRoom",
    roomCode
  );


  setupDisconnect();

  listenRoom();

};


/* =========================
   DISCONNECT
========================= */

function setupDisconnect(){

  if(!roomCode) return;

  const playerRef =
    ref(
      db,
      "rooms/"+roomCode+"/players/"+myId
    );

  onDisconnect(playerRef).remove();

}


/* =========================
   LISTEN
========================= */

function listenRoom(){

  if(unsubscribe){

    unsubscribe();

  }


  const roomRef =
    ref(
      db,
      "rooms/"+roomCode
    );


  unsubscribe =
    onValue(roomRef,(snapshot)=>{

      if(!snapshot.exists()){

        roomCode = null;
        roomData = null;
        showScreen("homeScreen");
        showError("방이 종료되었습니다.");
        return;

      }


      roomData = snapshot.val();


      renderGame();


      checkAutoProgress();

    });

}


/* =========================
   RENDER
========================= */

function renderGame(){

  if(!roomData) return;


  switch(roomData.phase){

    case "lobby":
      renderLobby();
      break;

    case "answer":
      renderAnswer();
      break;

    case "reveal":
      renderReveal();
      break;

    case "vote":
      renderVote();
      break;

    case "result":
      renderResult();
      break;

    case "gameover":
      renderResult();
      break;

  }

}


/* =========================
   LOBBY
========================= */

function renderLobby(){

  showScreen("lobbyScreen");


  document
    .getElementById("roomCodeDisplay")
    .innerText = roomCode;


  const players =
    roomData.players || {};


  const list =
    document.getElementById("playerList");


  list.innerHTML = "";


  const playerIds =
    Object.keys(players);


  playerIds.forEach(id=>{

    const div =
      document.createElement("div");

    div.className = "player";


    const name =
      players[id].name || "이름 없음";


    const badge =
      id === roomData.hostId
        ? '<span class="badge host-badge">방장</span>'
        : '<span class="badge">플레이어</span>';


    div.innerHTML =
      `<span>${escapeHtml(name)}</span>${badge}`;


    list.appendChild(div);

  });


  document
    .getElementById("playerCount")
    .innerText =
      playerIds.length +
      "명 참가 중";


  const isHost =
    roomData.hostId === myId;


  document
    .getElementById("startButton")
    .classList.toggle(
      "hidden",
      !isHost
    );


  document
    .getElementById("waitingMessage")
    .classList.toggle(
      "hidden",
      isHost
    );


  if(isHost){

    document
      .getElementById("waitingMessage")
      .innerText =
        playerIds.length >= 4
        ? "참가자가 충분합니다. 게임을 시작하세요!"
        : "최소 4명이 필요합니다.";

    document
      .getElementById("startButton")
      .disabled =
        playerIds.length < 4;

  }

}


/* =========================
   START GAME
========================= */

window.startGame = async function(){

  if(!roomData) return;

  if(roomData.hostId !== myId){

    return;

  }


  const players =
    Object.keys(
      roomData.players || {}
    );


  if(players.length < 4){

    alert("최소 4명이 필요합니다.");
    return;

  }


  const spyId =
    players[
      Math.floor(
        Math.random()*players.length
      )
    ];


  const firstQuestion =
    getRandomQuestion(roomData.usedQuestions || {});


  await update(

    ref(db,"rooms/"+roomCode),

    {

      phase:"answer",

      round:1,

      spyId:spyId,

      question:firstQuestion,

      answers:{},

      votes:{},

      usedQuestions:{
        [firstQuestion.id]:true
      },

      result:null

    }

  );

};


/* =========================
   QUESTION
========================= */

function getRandomQuestion(used){

  const available =
    questions.filter(
      (_,index)=>
        !used[index]
    );


  const pool =
    available.length
      ? available
      : questions;


  const original =
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];


  const index =
    questions.indexOf(original);


  return {

    id:index,

    question:original.question,

    choices:original.choices

  };

}


/* =========================
   ANSWER SCREEN
========================= */

function renderAnswer(){

  showScreen("answerScreen");


  const round =
    roomData.round;


  document
    .getElementById("answerRound")
    .innerText =
      `ROUND ${round} / 3`;


  const q =
    roomData.question;


  document
    .getElementById("answerSituation")
    .innerText =
      q.situation;


  const isSpy =
    roomData.spyId === myId;


  const questionBox =
    document.getElementById("questionBox");


  const spyNotice =
    document.getElementById("spyNotice");


  questionBox.classList.toggle(
    "hidden",
    isSpy
  );


  spyNotice.classList.toggle(
    "hidden",
    !isSpy
  );


  if(!isSpy){

    document
      .getElementById("answerQuestion")
      .innerText =
        q.question;

  }


  const choices =
    document.getElementById("choices");


  choices.innerHTML = "";


  const myAnswer =
    roomData.answers &&
    roomData.answers[round] &&
    roomData.answers[round][myId];


  q.choices.forEach(
    (choice,index)=>{

      const button =
        document.createElement("button");


      button.className =
        "choice";


      if(myAnswer === index){

        button.classList.add(
          "selected"
        );

      }


      button.innerText =
        choice;


      button.onclick =
        () => submitAnswer(index);


      choices.appendChild(button);

    }
  );


  const answerCount =
    Object.keys(
      (roomData.answers &&
       roomData.answers[round]) || {}
    ).length;


  const playerCount =
    Object.keys(
      roomData.players || {}
    ).length;


  document
    .getElementById("answerStatus")
    .innerText =
      `선택 완료 ${answerCount} / ${playerCount}`;

}


/* =========================
   SUBMIT ANSWER
========================= */

async function submitAnswer(index){

  if(!roomData) return;


  const round =
    roomData.round;


  await set(

    ref(
      db,
      `rooms/${roomCode}/answers/${round}/${myId}`
    ),

    index

  );

}


/* =========================
   AUTO PROGRESS
========================= */

async function checkAutoProgress(){

  if(!roomData) return;


  if(roomData.phase !== "answer") return;


  if(roomData.hostId !== myId) return;


  const players =
    Object.keys(
      roomData.players || {}
    );


  const answers =
    Object.keys(
      (roomData.answers &&
       roomData.answers[roomData.round]) || {}
    );


  if(
    answers.length >= players.length
  ){

    await update(

      ref(db,"rooms/"+roomCode),

      {

        phase:"reveal"

      }

    );

  }

}


/* =========================
   REVEAL
========================= */

function renderReveal(){

  showScreen("revealScreen");


  document
    .getElementById("revealRound")
    .innerText =
      `ROUND ${roomData.round} / 3`;


  document
    .getElementById("revealSituation")
    .innerText =
      roomData.question.situation;

  const resultBox =
    document.getElementById("answerResults");

  
  resultBox.innerHTML = "";


  const answers =
    roomData.answers[roomData.round] || {};


  Object.keys(answers).forEach(id => {

  const player =
    roomData.players[id];


  if(!player) return;


  const choice =
    roomData.question.choices[
      answers[id]
    ];


  const div =
    document.createElement("div");


  div.className = "player";


  div.innerHTML =
    `
    <span>${escapeHtml(player.name)}</span>
    <span>${escapeHtml(choice)}</span>
    `;


  resultBox.appendChild(div);

});

  document
    .getElementById("revealQuestion")
    .innerText =
      roomData.question.question;


  const area =
    document.getElementById(
      "revealHostButton"
    );


  area.innerHTML = "";


  if(roomData.hostId === myId){

    const button =
      document.createElement("button");


    button.className = "green";


    button.innerText =
      "투표 시작";


    button.onclick =
      startVoting;


    area.appendChild(button);

  }else{

    area.innerHTML =
      '<div class="status">방장이 투표를 시작하기를 기다리는 중...</div>';

  }

}


/* =========================
   START VOTE
========================= */

async function startVoting(){

  await update(

    ref(db,"rooms/"+roomCode),

    {

      phase:"vote",

      votes:{}

    }

  );

}


/* =========================
   VOTE
========================= */

function renderVote(){

  showScreen("voteScreen");


  document
    .getElementById("voteRound")
    .innerText =
      `ROUND ${roomData.round} / 3`;


  document
    .getElementById("voteSituation")
    .innerText =
      roomData.question.situation;


  document
    .getElementById("voteQuestion")
    .innerText =
      roomData.question.question;


  const container =
    document.getElementById(
      "votePlayers"
    );


  container.innerHTML = "";


  const players =
    roomData.players || {};


  selectedVote = null;


  Object.keys(players).forEach(id=>{

    if(id === myId) return;


    const button =
      document.createElement("button");


    button.className =
      "vote-player";


    button.innerText =
      players[id].name;


    button.onclick = ()=>{

      selectedVote = id;


      document
        .querySelectorAll(".vote-player")
        .forEach(
          b=>b.classList.remove("selected")
        );


      button.classList.add("selected");


      document
        .getElementById("voteButton")
        .disabled = false;

    };


    container.appendChild(button);

  });


  const votes =
    Object.keys(
      roomData.votes || {}
    ).length;


  const total =
    Object.keys(players).length;


  const alreadyVoted =
    roomData.votes &&
    roomData.votes[myId];


  document
    .getElementById("voteStatus")
    .innerText =
      alreadyVoted
      ? `투표 완료 (${votes}/${total})`
      : `투표 ${votes}/${total}`;


  document
    .getElementById("voteButton")
    .disabled =
      !!alreadyVoted;

}


/* =========================
   SUBMIT VOTE
========================= */

window.submitVote = async function(){

  if(!selectedVote) return;


  await set(

    ref(
      db,
      `rooms/${roomCode}/votes/${myId}`
    ),

    selectedVote

  );


  document
    .getElementById("voteButton")
    .disabled = true;


  if(roomData.hostId === myId){

    setTimeout(
      checkVotes,
      500
    );

  }

};


/* =========================
   CHECK VOTES
========================= */

async function checkVotes(){

  if(!roomData) return;

  if(roomData.phase !== "vote") return;

  if(roomData.hostId !== myId) return;


  const players =
    Object.keys(
      roomData.players || {}
    );


  const votes =
    roomData.votes || {};


  if(
    Object.keys(votes).length <
    players.length
  ){

    return;

  }


  const count = {};


  Object.values(votes).forEach(target=>{

    count[target] =
      (count[target] || 0) + 1;

  });


  let maxVotes = Math.max(...Object.values(count));

let topPlayers = Object.keys(count).filter(
    id => count[id] === maxVotes
);

let mostVoted = null;
let highest = maxVotes;


// 동률이면 아무도 탈락하지 않음
if(topPlayers.length === 1){
    mostVoted = topPlayers[0];
}


  const caught =
    mostVoted !== null &&
    mostVoted === roomData.spyId;


  await update(

    ref(db,"rooms/"+roomCode),

    {

      phase:"result",

      result:{

        caught:caught,

        votedPlayer:mostVoted,

        voteCount:highest,

        spyId:roomData.spyId

      }

    }

  );

}


/* =========================
   RESULT
========================= */

function renderResult(){

  showScreen("resultScreen");


  const result =
    roomData.result;


  if(!result) return;


  const spyName =
    roomData.players[result.spyId]
      ? roomData.players[result.spyId].name
      : "알 수 없음";


  const votedName =
    roomData.players[result.votedPlayer]
      ? roomData.players[result.votedPlayer].name
      : "없음";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const text =
    document.getElementById(
      "resultText"
    );


  const area =
    document.getElementById(
      "nextRoundArea"
    );


  if(result.votedPlayer === null){

    title.innerText =
    "⚖️ 동률 발생!";

    text.innerHTML =
    `최다 득표자가 여러 명이라 아무도 탈락하지 않았습니다.<br>
    다음 라운드를 진행합니다.`;

    area.innerHTML = "";

}

  else if(result.caught){

    title.innerText =
    "🎉 시민 승리!";

    text.innerHTML =
    `스파이는 <strong>${escapeHtml(spyName)}</strong>였습니다.<br>
    ${escapeHtml(votedName)}에게 ${result.voteCount}표가 몰렸습니다.`;

    area.innerHTML = "";

}


    if(roomData.hostId === myId){

      const button =
        document.createElement("button");


      button.className = "green";


      button.innerText =
        "새 게임 시작";


      button.onclick =
        resetGame;


      area.appendChild(button);

    }

  }else{

    if(roomData.round >= 3){

      title.innerText =
        "🕵️ 스파이 승리!";


      text.innerHTML =
        `스파이 <strong>${escapeHtml(spyName)}</strong>가
         3라운드 동안 잡히지 않았습니다.`;

      area.innerHTML = "";


      if(roomData.hostId === myId){

        const button =
          document.createElement("button");


        button.className = "green";


        button.innerText =
          "새 게임 시작";


        button.onclick =
          resetGame;


        area.appendChild(button);

      }

    }else{

      title.innerText =
        "😈 스파이를 놓쳤습니다!";


      text.innerHTML =
        `이번 라운드에서는
         <strong>${escapeHtml(votedName)}</strong>에게
         가장 많은 표가 갔지만 스파이가 아니었습니다.<br><br>
         스파이는 아직 살아있습니다.`;

      area.innerHTML = "";


      if(roomData.hostId === myId){

        const button =
          document.createElement("button");


        button.className = "green";


        button.innerText =
          `ROUND ${roomData.round + 1} 시작`;


        button.onclick =
          nextRound;


        area.appendChild(button);

      }else{

        area.innerHTML =
          '<div class="status">방장이 다음 라운드를 시작하기를 기다리는 중...</div>';

      }

    }

  }

}


/* =========================
   NEXT ROUND
========================= */

async function nextRound(){

  if(roomData.hostId !== myId) return;


  const used =
    roomData.usedQuestions || {};


  const nextQuestion =
    getRandomQuestion(used);


  const newUsed = {

    ...used,

    [nextQuestion.id]:true

  };


  await update(

    ref(db,"rooms/"+roomCode),

    {

      phase:"answer",

      round:roomData.round + 1,

      question:nextQuestion,

      answers:{},

      votes:{},

      usedQuestions:newUsed,

      result:null

    }

  );

}


/* =========================
   RESET GAME
========================= */

async function resetGame(){

  if(roomData.hostId !== myId) return;


  await update(

    ref(db,"rooms/"+roomCode),

    {

      phase:"lobby",

      round:0,

      spyId:"",

      question:null,

      answers:{},

      votes:{},

      usedQuestions:{},

      result:null

    }

  );

}


/* =========================
   LEAVE
========================= */

window.leaveRoom = async function(){

  if(roomCode){

    await remove(

      ref(
        db,
        `rooms/${roomCode}/players/${myId}`
      )

    );

  }


  if(unsubscribe){

    unsubscribe();
    unsubscribe = null;

  }


  roomCode = null;
  roomData = null;


  localStorage.removeItem(
    "spyCheckRoom"
  );


  showScreen("homeScreen");

};


/* =========================
   COPY
========================= */

window.copyRoomCode = async function(){

  try{

    await navigator.clipboard.writeText(
      roomCode
    );

    alert("방 코드가 복사되었습니다.");

  }catch(e){

    alert(
      "방 코드: " + roomCode
    );

  }

};


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   AUTO JOIN AFTER REFRESH
========================= */

const savedRoom =
  localStorage.getItem(
    "spyCheckRoom"
  );


if(savedRoom){

  const snapshot =
    await get(
      ref(db,"rooms/"+savedRoom)
    );


  if(snapshot.exists()){

    roomCode = savedRoom;

    setupDisconnect();
    listenRoom();

  }

}
